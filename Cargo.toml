[package]
name = "attractor"
version = "0.1.0"
edition = "2024"
description = "Strange attractors as a GPU screensaver and live wallpaper for Omarchy"
license = "MIT"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1.0.1"
serde_json = "1.0.151"
wgpu = "30.0.1"
winit = "0.30"
smithay-client-toolkit = "0.19"
wayland-backend = { version = "0.3", features = ["client_system"] }
raw-window-handle = "0.6"
resvg = { version = "0.45", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
